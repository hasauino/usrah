<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <!--
    Room layout v2: hotspot placement, measured from the locked 3D room (tools/blender/usrah/room.py).
    The 3D room is the source of truth; this sketch documents it.
    Canvas = 16:9 room (0..900) + legend strip (900..1000).
    Dashed box = 4:3 safe area (x 200..1400). Everything tappable lives inside it.
    Fill colour = status: slice1 / next / later / ambient / system.
  -->
  <defs>
    <style>
      .wall { fill: #F6E9CF; stroke: #b9a27c; stroke-width: 2; }
      .side { fill: #EAD9B8; stroke: #b9a27c; stroke-width: 2; }
      .floor { fill: #8DB580; fill-opacity: .55; stroke: #6d9163; stroke-width: 2; }
      .furn { fill: #D9A05B; fill-opacity: .35; stroke: #8a5a26; stroke-width: 2; }
      .hot { stroke-width: 3; fill-opacity: .55; }
      .slice1 { fill: #3D7BD9; stroke: #1f4f99; }
      .next { fill: #2F9C95; stroke: #1b625d; }
      .later { fill: #F4C542; stroke: #a7811a; }
      .ambient { fill: #ffffff; stroke: #8a8a8a; stroke-dasharray: 6 4; }
      .system { fill: #D9734E; stroke: #8e3f22; }
      .lbl { font-size: 15px; fill: #2b2420; font-weight: 600; }
      .ar { font-size: 16px; fill: #2b2420; direction: rtl; unicode-bidi: plaintext; }
      .note { font-size: 13px; fill: #4f4338; }
      .safe { fill: none; stroke: #c0392b; stroke-width: 2.5; stroke-dasharray: 14 8; }
    </style>
  </defs>

  <!-- Room shell -->
  <rect x="0" y="0" width="1600" height="900" fill="#F2D9B4"/>
  <polygon class="side" points="0,20 260,60 260,560 0,770"/>
  <polygon class="side" points="1600,20 1340,60 1340,560 1600,770"/>
  <polygon class="floor" points="0,770 260,560 1340,560 1600,770 1600,900 0,900"/>
  <rect class="wall" x="260" y="60" width="1080" height="500"/>

  <!-- Rug -->
  <ellipse cx="800" cy="765" rx="428" ry="112" fill="#D9734E" fill-opacity=".3" stroke="#D9734E" stroke-width="2"/>

  <!-- Furniture (non-interactive bodies) -->
  <rect class="furn" x="247" y="130" width="221" height="448" rx="6"/>
  <line x1="247" y1="262" x2="468" y2="262" stroke="#8a5a26" stroke-width="3"/>
  <line x1="247" y1="398" x2="468" y2="398" stroke="#8a5a26" stroke-width="3"/>
  <rect class="furn" x="962" y="440" width="348" height="138" rx="8"/>
  <rect class="furn" x="668" y="605" width="264" height="110" rx="10"/>
  <rect class="furn" x="1040" y="568" width="300" height="252" rx="12"/>
  <polygon points="38,735 325,738 430,600 340,570 245,490 40,600" fill="#D9734E" fill-opacity=".35" stroke="#8e3f22" stroke-width="2"/>

  <!-- Window with mashrabiya + curtains (ambient: light follows time of day) -->
  <rect class="hot ambient" x="650" y="115" width="300" height="315" rx="6"/>
  <rect x="585" y="78" width="65" height="450" rx="14" fill="#2F9C95" fill-opacity=".6"/>
  <rect x="950" y="78" width="65" height="450" rx="14" fill="#2F9C95" fill-opacity=".6"/>
  <text class="lbl" x="800" y="255" text-anchor="middle">Window + mashrabiya</text>
  <text class="ar" x="800" y="278" text-anchor="middle">النافذة</text>
  <text class="note" x="800" y="300" text-anchor="middle">light follows local time</text>

  <!-- Back-wall objects -->
  <rect class="hot slice1" x="490" y="150" width="98" height="95" rx="6"/>
  <text class="lbl" x="539" y="190" text-anchor="middle">Family photo</text>
  <text class="note" x="539" y="212" text-anchor="middle">→ profiles</text>

  <rect class="hot later" x="1012" y="140" width="108" height="130" rx="6"/>
  <text class="lbl" x="1066" y="190" text-anchor="middle">الله frame</text>
  <text class="note" x="1066" y="212" text-anchor="middle">→ تعلم الصلاة</text>

  <circle class="hot ambient" cx="1211" cy="165" r="42"/>
  <text class="lbl" x="1211" y="170" text-anchor="middle">Clock</text>
  <rect class="hot ambient" x="1172" y="230" width="84" height="100" rx="4"/>
  <text class="lbl" x="1214" y="275" text-anchor="middle">Hijri</text>
  <text class="lbl" x="1214" y="295" text-anchor="middle">calendar</text>

  <!-- Bookshelf objects -->
  <rect class="hot ambient" x="265" y="153" width="110" height="105" rx="4"/>
  <text class="lbl" x="320" y="210" text-anchor="middle">Books</text>
  <rect class="hot later" x="388" y="125" width="60" height="133" rx="4"/>
  <text class="lbl" x="418" y="185" text-anchor="middle">Big</text>
  <text class="lbl" x="418" y="203" text-anchor="middle">Ben</text>
  <text class="note" x="418" y="222" text-anchor="middle">كلمات</text>

  <rect class="hot later" x="275" y="305" width="80" height="87" rx="4"/>
  <text class="lbl" x="315" y="345" text-anchor="middle">Trophy</text>
  <text class="note" x="315" y="365" text-anchor="middle">اختبر</text>
  <rect class="hot next" x="365" y="308" width="78" height="82" rx="4"/>
  <text class="lbl" x="404" y="345" text-anchor="middle">Abacus</text>
  <text class="note" x="404" y="365" text-anchor="middle">احسب</text>

  <rect class="hot ambient" x="268" y="405" width="172" height="147" rx="4"/>
  <text class="lbl" x="354" y="480" text-anchor="middle">Plant · toys</text>

  <!-- Cabinet: TV + console -->
  <rect class="hot ambient" x="997" y="333" width="163" height="107" rx="8"/>
  <text class="lbl" x="1078" y="390" text-anchor="middle">TV (decor)</text>
  <rect class="hot later" x="1184" y="395" width="94" height="50" rx="8"/>
  <text class="lbl" x="1231" y="416" text-anchor="middle">Console</text>
  <text class="note" x="1231" y="434" text-anchor="middle">submarine</text>

  <!-- Door on right side wall -->
  <polygon class="hot system" points="1333,165 1400,168 1400,600 1333,560"/>
  <text class="lbl" x="1366" y="330" text-anchor="middle">Door</text>
  <text class="note" x="1366" y="352" text-anchor="middle">→ parents</text>
  <text class="note" x="1366" y="370" text-anchor="middle">(gate)</text>

  <!-- Floor objects -->
  <rect class="hot slice1" x="684" y="530" width="106" height="108" rx="12"/>
  <text class="lbl" x="737" y="570" text-anchor="middle">Letter</text>
  <text class="lbl" x="737" y="588" text-anchor="middle">cube أ١</text>
  <text class="note" x="737" y="608" text-anchor="middle">حروف وأرقام</text>

  <rect class="hot next" x="795" y="515" width="117" height="121" rx="12"/>
  <text class="lbl" x="853" y="570" text-anchor="middle">Camel toy</text>
  <text class="note" x="853" y="590" text-anchor="middle">حيوانات مرحة</text>

  <rect class="hot ambient" x="372" y="570" width="154" height="122" rx="10"/>
  <text class="lbl" x="449" y="628" text-anchor="middle">Dallah</text>
  <text class="note" x="449" y="647" text-anchor="middle">tray</text>

  <ellipse class="hot ambient" cx="285" cy="592" rx="50" ry="30"/>
  <text class="lbl" x="285" y="597" text-anchor="middle">Cat</text>

  <rect class="hot slice1" x="1120" y="460" width="142" height="280" rx="60"/>
  <text class="lbl" x="1191" y="590" text-anchor="middle">نبيه</text>
  <text class="lbl" x="1191" y="610" text-anchor="middle">on bench</text>
  <text class="note" x="1191" y="630" text-anchor="middle">tour · help</text>

  <!-- Kids appear contextually (walk in, sit on rug); not fixed hotspots -->
  <text class="note" x="800" y="840" text-anchor="middle">سارة و يوسف walk in / play on the rug contextually (not fixed hotspots)</text>

  <!-- 4:3 safe area -->
  <rect class="safe" x="200" y="0" width="1200" height="900"/>
  <text x="210" y="890" font-size="14" fill="#c0392b">4:3 safe area: everything tappable lives here · outside = decor for wide screens</text>

  <!-- Legend -->
  <rect x="0" y="900" width="1600" height="100" fill="#fbf7f0"/>
  <g transform="translate(30,935)">
    <rect class="hot slice1" width="28" height="28" rx="4"/><text class="lbl" x="38" y="20">Slice 1 (letters, profiles, host)</text>
    <rect class="hot next" x="330" width="28" height="28" rx="4"/><text class="lbl" x="368" y="20">Next (animals, math)</text>
    <rect class="hot later" x="600" width="28" height="28" rx="4"/><text class="lbl" x="638" y="20">Later (asleep until built)</text>
    <rect class="hot system" x="890" width="28" height="28" rx="4"/><text class="lbl" x="928" y="20">System (parents)</text>
    <rect class="hot ambient" x="1120" width="28" height="28" rx="4"/><text class="lbl" x="1158" y="20">Ambient tap reaction</text>
  </g>
  <text class="note" x="30" y="988">Room layout v2 · measured from the locked 3D room · canvas 1600×900 (16:9) · minimum tap target ≈ 80 px at this scale</text>
</svg>
